{% extends "rent/base.html" %}
{% block title %}Log in · Campus Cuts{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if form.errors %}<p class="msg error" role="alert" id="login-error">Wrong username or password.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Username <input name="username" autocomplete="username" autofocus required{% if form.errors %} aria-invalid="true" aria-describedby="login-error"{% endif %}></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required{% if form.errors %} aria-invalid="true" aria-describedby="login-error"{% endif %}></label>
    <button class="btn">Log in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</section>
{% endblock %}
